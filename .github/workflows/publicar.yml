name: Publicar o site

# Todo push na main monta o site e publica no GitHub Pages. Também dá para
# disparar à mão em Actions > Publicar o site > Run workflow.
#
# Pré-requisito, feito UMA vez: Settings > Pages > Source: "GitHub Actions".
# Sem isso o passo "configure-pages" falha com "Get Pages site failed" — não
# é defeito do código, é o Pages ainda desligado.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Conferir tipos e montar
        run: npm run build
        env:
          # O site mora em /<nome-do-repositório>/. Tirado do nome do
          # repositório, e não escrito à mão, para que renomeá-lo não deixe
          # o site em branco.
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
